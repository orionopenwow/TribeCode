<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>TribeCode app icon — "Campfire Brackets"</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211A4A"/>
      <stop offset="1" stop-color="#0B1426"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFC27A"/>
      <stop offset="0.55" stop-color="#FF6F8E"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#FF7A8A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FF7A8A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="url(#sheen)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
  <!-- code brackets: the tribe gathered around the fire -->
  <g fill="none" stroke="#E9E6FF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 172 L96 256 L176 340"/>
    <path d="M336 172 L416 256 L336 340"/>
  </g>
  <!-- the shared spark -->
  <path d="M256 128 C304 192 326 238 314 290 C305 330 282 356 256 356 C230 356 207 330 198 290 C186 238 208 192 256 128 Z" fill="url(#flame)"/>
  <path d="M256 236 C278 268 286 290 280 314 C276 332 266 342 256 342 C246 342 236 332 232 314 C226 290 234 268 256 236 Z" fill="#FFF3E6" fill-opacity="0.9"/>
  <!-- three embers: the tribe -->
  <g fill="#3DD6D0">
    <circle cx="216" cy="404" r="11"/>
    <circle cx="256" cy="412" r="11"/>
    <circle cx="296" cy="404" r="11"/>
  </g>
</svg>
