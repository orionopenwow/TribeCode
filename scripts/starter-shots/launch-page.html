<!doctype html><meta charset=utf-8><link rel=stylesheet href=base.css><body style="background:#F7F4EE;color:#1D2021"><div class=app style="text-align:center;padding-top:40px">

<script>const x=document.getElementById('c').getContext('2d');x.fillStyle='#3B4A6B';x.fillRect(0,110,600,40);for(let i=0;i<9;i++){const X=40+i*65;x.fillStyle='#2A313C';x.fillRect(X,70,4,40);x.fillStyle=i<5?'#F2CC8F':'#4A4A55';x.fillRect(X-6,58,16,14);}x.fillStyle='#E07A5F';x.fillRect(300,86,14,24);x.fillStyle='#F2CC8F';for(let i=0;i<40;i++)x.fillRect((i*137)%600,(i*53)%50,2,2);</script></body>
