# One-click TribeCode cloud server on Render's free plan (docs/CLOUD.md).
# Deploy: https://render.com/deploy?repo=https://github.com/orionopenwow/TribeCode
services:
  - type: web
    name: tribecode
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: TRIBE_CLOUD
        value: "1"
      - key: TRIBE_SETUP_CODE
        generateValue: true
      # Phone notifications that survive sleep: run `node scripts/dev/vapid-keys.js` and paste both values
      # (Render can't generate an EC key pair itself). Leave empty to skip; push then needs re-enabling after a wipe.
      - key: TRIBE_VAPID_PUBLIC
        sync: false
      - key: TRIBE_VAPID_PRIVATE
        sync: false
