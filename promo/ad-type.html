<!-- A 41-second kinetic-type ad (v0.27), after a classic motion-graphics pattern: a short headline types in word by word,
     a cut to the brand color with the logo, a line whose last word swaps in place, then one feature at a time as a large,
     detailed exhibit of the real app with the feature line as its caption. Self-contained (no libraries). Everything is drawn from the time t, so any frame renders exactly:
     ad-type.html?t=9.5, or window.adSeek(9.5). Landscape 16:9 and vertical 9:16 (text kept out of the bottom 20% and the
     right-hand UI strip) switch on the window's shape. Music: scripts/dev/ad-type-sound.py, 120 BPM, synced to the beats here. -->

<script>
(function () {
  'use strict';
  const D = 41, BEAT = .5, WMW = 562;                         // seconds; 120 BPM, matches the soundtrack
  const $ = id => document.getElementById(id);
  const ad = $('ad');
  const clamp = v => Math.max(0, Math.min(1, v));
  const k = (t, a, d) => clamp((t - a) / d);
  const outC = x => 1 - Math.pow(1 - x, 3);
  const outQ = x => 1 - Math.pow(1 - x, 5);
  const inC = x => x * x * x;
  const back = x => { const c = 1.25; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const lerp = (a, b, x) => a + (b - a) * x;
  let V = false, W = 1920, H = 1080;

  // ---------- timeline (seconds) ----------
  const INTRO = ['Build', 'apps', 'with', 'your', 'friends.'];
  const INTRO_AT = [.35, .7, 1.05, 1.4, 1.75];      // words land on 8th notes
  const T_TILT = 2.55, T_WIPE1 = 2.75, T_LOGO = 3.0, T_WM = 3.45, T_UP = 4.0;
  const BUILD = ['apps', 'games', 'websites', 'companies'];
  const BUILD_AT = [4.5, 5.25, 6.0, 6.75];          // swaps on the beat (1.5 beats apart)
  const T_WIPE2 = 7.75;                             // to the dark canvas for the features
  const FEATS = [                                  // five seconds each (10 beats): long enough to see what is happening
    { at: 8.0, words: ['One chat for friends and their AI.'], ex: exChat, side: -1, tint: '#1D2138' },
    { at: 13.0, pre: 'Bring your own', swap: ['Claude.', 'Codex.', 'Gemini.'], swapAt: [13.0, 16.5, 17.1], ex: exAgents, side: 1, tint: '#14292A' },
    { at: 18.0, words: ['A live preview while it’s built.'], ex: exPreview, side: -1, tint: '#2E1D12' },
    { at: 23.0, words: ['Docs, tasks and a whiteboard.'], ex: exDocs, side: 1, tint: '#2A2514' },
    { at: 28.0, words: ['Run it as a company.'], ex: exCompany, side: -1, tint: '#14292A' },
    { at: 33.0, words: ['Free and open source.'], ex: exOpen, side: 1, tint: '#1D2138' },
  ];
  const T_WIPE3 = 37.75, T_END = 38.0, T_COLLAPSE = 39.6;

  // ---------- layout ----------
  function fit() {
    V = innerHeight > innerWidth; ad.classList.toggle('v', V);
    W = V ? 1080 : 1920; H = V ? 1920 : 1080;
    const s = Math.min(innerWidth / W, innerHeight / H);
    ad.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
    widths = {};
  }
  // the vertical cut keeps text in the safe middle: away from the bottom ~20% and the right-hand UI strip
  const lineY = () => V ? 860 : 560;             // centre of the main line

  // ---------- word widths (for slots that glide between words) ----------
  let widths = {};
  const meas = document.createElement('span'); meas.className = 'h'; meas.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
  ad.appendChild(meas);
  function wOf(word, el) { const fs = getComputedStyle(el).fontSize, key = fs + '|' + word; if (widths[key] == null) { meas.style.fontSize = fs; meas.textContent = word; widths[key] = meas.getBoundingClientRect().width / (ad.getBoundingClientRect().width / W); } return widths[key]; }

  // A slot showing words[i] at times at[i]: the old word slides up and out, the new one rises in with a little overshoot,
  // and the slot's width glides so the words around it move smoothly instead of jumping.
  function slot(el, words, at, t) {
    let i = -1; for (let j = 0; j < at.length; j++) if (t >= at[j]) i = j;
    if (i < 0) { el.innerHTML = ''; el.style.width = '0px'; return; }
    const p = k(t, at[i], .32), prev = i > 0 ? words[i - 1] : null;
    const wNew = wOf(words[i], el), wOld = prev ? wOf(prev, el) : wNew;
    el.style.width = lerp(wOld, wNew, outQ(k(t, at[i], .38))).toFixed(1) + 'px';
    const yIn = (1 - back(p)) * 100, yOut = -outC(p) * 100;
    el.innerHTML = (prev && p < 1 ? `<b style="transform:translateY(${yOut.toFixed(2)}%);opacity:${(1 - outC(p)).toFixed(3)}">${prev}</b>` : '') +
      `<b style="transform:translateY(${yIn.toFixed(2)}%);opacity:${outC(k(t, at[i], .2)).toFixed(3)}">${words[i]}</b>`;
  }
  const pop = (t, a) => { const p = k(t, a, .34); return `transform:translateY(${((1 - back(p)) * 60).toFixed(1)}px);opacity:${outC(k(t, a, .2)).toFixed(3)}`; };

  // ---------- exhibits: one screen-filling, detailed micro-UI per feature, drawn from local time lt (0..5 s) ----------

  const typed = (s, lt, a, cps) => s.slice(0, Math.max(0, Math.min(s.length, Math.floor((lt - a) * cps))));
  const ap = (lt, a, d = .35) => { const p = k(lt, a, d); return `opacity:${outC(p).toFixed(3)};transform:translateY(${((1 - back(p)) * 26).toFixed(1)}px)`; };
  const vis = (lt, a) => lt >= a ? '' : 'visibility:hidden;';
  const count = (lt, a, d, v) => Math.round(v * outC(k(lt, a, d)));
  const lights = '<span class="ex-lt"><i></i><i></i><i></i></span>';
  const caret = lt => Math.floor(lt * 3) % 2 ? '<span class="ex-caret"></span>' : '<span class="ex-caret" style="opacity:0"></span>';

  function exChat(lt) {

    return `<div class="ex-win ex-chat">

        <span><i class="dot" style="background:var(--indigo)"></i>Maya</span><span><i class="dot" style="background:var(--ember)"></i>Orion</span><span><i class="dot ring" style="border-color:var(--teal)"></i>Orion's Claude</span><span><i class="dot ring" style="border-color:var(--indigo)"></i>Maya's Codex</span></aside>`}
      <div class="ex-main">

          <div class="ex-msg" style="${vis(lt, 1.1)}${ap(lt, 1.1)}"><span class="ex-av ai" style="border-color:var(--teal);color:var(--teal)">✦</span><div style="flex:1"><p class="ex-who">Orion's Claude <em>Claude Code</em><time>7:02 PM</time></p>

  function exPreview(lt) {

        <div class="ka-tiles">${tiles.map((x, i) => `<div class="ka-tile" style="${vis(lt, .8 + i * .15)}${ap(lt, .8 + i * .15)}"><small>${x[0]}</small><b>${count(lt, .8 + i * .15, .7, x[1])}</b><em>${x[2]}</em></div>`).join('')}</div>

    return `<div class="ex-grid2 os">
      <div class="ex-col2">
        <div class="ex-win ex-pad ex-repo" style="${ap(lt, .2)}"><p class="ex-repo-t"><span class="gh">⌂</span>orionopenwow / <b>TribeCode</b><span class="ex-tag">Public</span></p>
          <p class="ex-small">Build apps, games and websites with your friends and AI helpers.</p>
          <div class="ex-repo-row"><span class="ex-tag">⚖ MIT license</span><span class="ex-tag">● JavaScript</span><span class="ex-gh${starred ? ' on' : ''}">${starred ? '★ Starred' : '☆ Star'}</span><span class="ex-gh">⑂ Fork</span></div></div>
        <div class="ex-win ex-term" style="${vis(lt, 1.3)}${ap(lt, 1.3)}"><div class="ex-bar sm">${lights}<span class="ex-url">terminal</span></div>
          <pre>${typed(l1, lt, 1.5, 45)}${lt >= 1.5 + l1.length / 45 ? '\n' + typed(l2, lt, 2.5, 40) : ''}${lt >= 3.1 ? '\n<span class="g">✓ TribeCode is running → http://localhost:4747</span>' : ''}${lt < 3.1 ? caret(lt) : ''}</pre></div>
      </div>
      <div class="ex-win ex-mini" style="${ap(lt, .5)}"><div class="ex-bar sm">${lights}<span class="ex-url">localhost:4747</span></div>
        ${appOn ? '' : `<div class="ex-wait"><span class="ex-ring" style="transform:rotate(${(lt * 300).toFixed(0)}deg)"></span><b>${lt < 3.1 ? 'Waiting for the server…' : 'Starting TribeCode…'}</b><small>npm start runs it on your own computer or server</small></div>`}
        <div class="ex-mini-b" style="${appOn ? ap(lt, 3.4, .4) : 'display:none'}"><aside><i class="on"></i><i></i><i></i><i></i></aside><div><p class="ex-eb">Home</p><h4 class="ex-h">Good evening, Camp</h4>
          <div class="ex-mini-c"><div><small>Pick up where you left off</small><b>Kombucha Empire</b></div><div><small>Invite a friend</small><b>Copy the link</b></div></div>
          <div class="ex-mini-c"><div><small>Your AI</small><b>✦ Connected</b></div><div><small>Preview</small><b>● Live</b></div></div>
          <div class="ex-mini-c"><div><small>Task Board</small><b>3 open · 5 done</b></div><div><small>Company</small><b>4 seats filled</b></div></div></div></div></div>
    </div>`;
  }

  // ---------- one frame ----------
  function render(T) {
    const t = Math.max(0, Math.min(D - 1e-3, T));
    // background wipes: panels rise from the bottom (ember → dark → ember)
    const wipe = (id, a) => { const p = k(t, a, .32); $(id).style.height = (outC(p) * 100).toFixed(2) + '%'; };
    wipe('wipe1', T_WIPE1); wipe('wipe2', T_WIPE2); wipe('wipe3', T_WIPE3);

    // intro: words land one by one, then the whole line tilts and drops away
    const intro = $('intro');
    if (t < T_WIPE1 + .35) {
      intro.style.display = 'flex';
      $('introH').innerHTML = INTRO.map((w, i) => `<span class="w" style="${pop(t, INTRO_AT[i])}">${w}</span>`).join('');
      const p = inC(k(t, T_TILT, .45));
      intro.style.transform = `translateY(${(p * 260).toFixed(1)}px) rotate(${(-7 * p).toFixed(2)}deg) scale(${(1 - .35 * p).toFixed(3)})`;
      intro.style.opacity = (1 - k(t, T_TILT + .2, .25)).toFixed(3);
    } else intro.style.display = 'none';

    // logo: the mark drops in with a bounce, the wordmark slides out from behind it, then it all moves up small
    const logo = $('logo');
    const logoOn = (t >= T_LOGO && t < T_WIPE2 + .3) || t >= T_END;
    logo.style.display = logoOn ? 'flex' : 'none';
    if (logoOn) {
      const end = t >= T_END;
      const a0 = end ? T_END : T_LOGO, aW = end ? T_END + .25 : T_WM;
      const drop = back(k(t, a0, .45));
      const wmP = outQ(k(t, aW, .45));
      const wmW = WMW * wmP;
      $('wmClip').style.width = wmW.toFixed(1) + 'px';
      // end card: the wordmark tucks back behind the mark (like the classic sign-off)
      if (end) { const c = outQ(k(t, T_COLLAPSE, .4)); $('wmClip').style.width = (WMW * wmP * (1 - c)).toFixed(1) + 'px'; }
      const fullW = 168 + parseFloat($('wmClip').style.width);
      const up = end ? 0 : outQ(k(t, T_UP, .45));
      const sc = lerp(1, .42, up);
      const cy = lerp(H / 2 - (end ? 70 : 0), V ? 250 : 120, up);
      logo.style.transform = `translate(${(-fullW * sc / 2).toFixed(1)}px, ${(cy - 84 * sc - (1 - drop) * 180).toFixed(1)}px) scale(${sc.toFixed(4)})`;
      logo.style.left = '50%'; logo.style.top = '0px';
      logo.style.opacity = outC(k(t, a0, .15)).toFixed(3);
      // over the dark canvas wipe, fade the small header logo out
      if (!end) logo.style.opacity = (outC(k(t, a0, .15)) * (1 - k(t, T_WIPE2, .25))).toFixed(3);
    }

    // "Build ___ together." with the swapping word
    const bl = $('buildLine');
    const blOn = t >= BUILD_AT[0] - .05 && t < T_WIPE2 + .3;
    bl.style.display = blOn ? 'flex' : 'none';
    if (blOn) {
      bl.style.top = (lineY() - 70) + 'px';
      slot($('slotB'), BUILD, BUILD_AT, t);
      const p = k(t, BUILD_AT[0], .34);
      bl.firstElementChild.style.cssText = `transform:translateY(${((1 - back(p)) * 50).toFixed(1)}px);opacity:${(outC(k(t, BUILD_AT[0], .2)) * (1 - k(t, T_WIPE2, .2))).toFixed(3)}`;
    }

    // features: a big exhibit with the feature line as its caption; a slow push-in while it runs
    const fl = $('featLine'), ex = $('ex');
    let f = null; for (const x of FEATS) if (t >= x.at) f = x;
    const featOn = f && t < T_WIPE3 + .3;
    fl.style.display = ex.style.display = featOn ? '' : 'none'; if (!featOn) $('exbg').style.display = 'none';
    if (featOn) {
      const lt = t - f.at, next = FEATS[FEATS.indexOf(f) + 1], outAt = next ? next.at - .3 : T_WIPE3 - .1;
      const o = outC(k(t, outAt, .3)), inP = outC(k(lt, 0, .45));
      fl.style.top = (V ? 1372 : 846) + 'px';
      const fh = fl.firstElementChild;
      if (f.swap) {
        fh.innerHTML = `<span class="sw" style="${pop(t, f.at)}"><span class="w">${f.pre}</span><span class="sp"></span><span class="slot" id="slotF"></span></span>`;
        slot($('slotF'), f.swap, f.swapAt, t);
      } else fh.innerHTML = `<span class="w" style="${pop(t, f.at)}">${f.words[0]}</span>`;
      fl.style.transform = `translateY(${(-o * 50).toFixed(1)}px)`; fl.style.opacity = (1 - o).toFixed(3);
      const push = 1 + .045 * (lt / 5) * (lt / 5) * (3 - 2 * lt / 5);   // smoothstep push-in over the five seconds
      ex.innerHTML = f.ex(lt);
      const S = V ? 1.06 : 1.2, side = f.side;                       // the design box is scaled up to fill the frame
      ex.style.transform = `translate(${(side * (1 - inP) * 80).toFixed(1)}px, ${(-o * 40).toFixed(1)}px) scale(${(S * (.97 + .03 * inP) * push).toFixed(4)})`;
      ex.style.opacity = (inP * (1 - o)).toFixed(3);
      // a big flat block in the feature's colour bleeds off one edge behind the exhibit, alternating sides
      const bg = $('exbg'), bw = V ? 980 : 1100, bh = V ? 1260 : 980;
      bg.style.background = f.tint; bg.style.width = bw + 'px'; bg.style.height = bh + 'px';
      const bx = side < 0 ? (V ? -420 : -520) : W - (V ? 560 : 580), by = V ? 120 : 20;
      bg.style.transform = `translate(${(bx + side * (1 - inP) * 220 - side * 30 * (lt / 5)).toFixed(1)}px, ${by}px)`;
      bg.style.opacity = (inP * (1 - o)).toFixed(3); bg.style.display = '';
    }

    // end card: url and line under the logo
    const u = $('urlRow'), fo = $('foss');
    const uOn = t >= T_END + .45;
    u.style.display = fo.style.display = uOn ? 'flex' : 'none';
    if (uOn) {
      u.style.top = (H / 2 + 80) + 'px'; u.style.cssText += `;${pop(t, T_END + .45)}`;
      fo.style.top = (H / 2 + 200) + 'px'; fo.style.opacity = outC(k(t, T_END + .7, .3)).toFixed(3);
    }
  }

  let seekT = null;
  window.adSeek = t => { seekT = t; render(t); return document.fonts ? document.fonts.ready.then(() => true) : true; };
  const q = new URLSearchParams(location.search);
  addEventListener('resize', () => { fit(); render(seekT ?? 0); });
  fit();
  const go = () => {
    widths = {};
    if (q.has('t')) { seekT = parseFloat(q.get('t')) || 0; render(seekT); }
    else if (q.has('still') || matchMedia('(prefers-reduced-motion: reduce)').matches) render(39.3);
    else { const t0 = performance.now(); const loop = now => { if (seekT === null) render(((now - t0) / 1000) % D); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  };
  // on Ember, the wordmark's ember "Code" would vanish: draw it all in white with its dark outline (same drawing, one colour swapped)
  const wmReady = fetch('../site/assets/brand/wordmark.svg').then(r => r.text()).then(svg => new Promise(res => {
    const im = $('wm'); im.onload = res; im.onerror = res;
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace(/#F26B1D/gi, '#F8FAFC').replace(/#A8471B/gi, '#A8A29E'));
  })).catch(() => {});
  Promise.all([document.fonts ? document.fonts.ready : 0, wmReady]).then(go);
})();
</script>
</body>
</html>
