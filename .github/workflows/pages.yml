# Publishes the web app to GitHub Pages: app/ui is the site root (the website IS the app) and the
# marketing site lives under /about/. Pages only hosts the app shell and downloads: there is no tribe
# server there, so the app runs solo (local Tasks and Docs) until someone opens an invite link, which
# takes them to the host's own server. Every tribe's data stays in its host's tribe folder.
#
# One-time setup (done): repo Settings → Pages → Source: "GitHub Actions". Friend links use go.html here.
name: Pages

on:
  push:
    branches: [main]
    paths: ['app/ui/**', 'site/**', 'scripts/pages-compat/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble _site
        run: |
          # The website is the front page; the web app lives at /app/ (one tap from every page of the site).
          mkdir -p _site/app
          cp -R site/. _site/
          cp -R app/ui/. _site/app/
          mkdir -p _site/.well-known && cp app/ui/.well-known/assetlinks.json _site/.well-known/   # Android TWA: Digital Asset Links at the domain root (mobile/android/README.md)
          # old addresses keep working: friend links (go.html), the demo, /about/, and the old root service worker
          cp -R scripts/pages-compat/. _site/
          touch _site/.nojekyll
          # unknown paths: under /app/ back to the app, anything else to the front page
          # works at tribecode.org (no prefix) and at <owner>.github.io/<repo>/ (one prefix segment)
          printf '<!DOCTYPE html><meta charset="utf-8"><title>TribeCode</title><script>var g=/github\\.io$/.test(location.hostname),p=location.pathname.split("/").filter(Boolean),b=g&&p.length?"/"+p[0]:"",r=g?p[1]:p[0];location.replace(b+(r==="app"?"/app/":"/"))</script>' > _site/404.html
          # the custom domain (also set in Settings > Pages); a fork deploys without it
          if [ "$GITHUB_REPOSITORY" = "orionopenwow/TribeCode" ]; then echo "tribecode.org" > _site/CNAME; fi
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
