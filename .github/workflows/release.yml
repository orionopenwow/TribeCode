# Builds the desktop app and publishes a GitHub Release whenever a version tag is pushed.
# The release includes latest.json, which the in-app updater polls to show "Restart to update".
#
# One-time setup: run `node scripts/setup-release.js` on your computer. It creates the signing key,
# stores TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) as secrets and TAURI_UPDATER_PUBKEY as a variable,
# then tags and pushes so this workflow runs. Without the key, installers still build (no auto-update).
name: Release

on:
  push:
    tags: ['v*']
    # A version bump on main releases too (tauri-action creates the vX.Y.Z tag), so no tag push is needed.
    branches: [main]
    paths: ['app/src-tauri/tauri.conf.json', '.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The gate: a release builds only after the essentials pass (v0.20). Joining, staying signed in, the outbox,
  # security and the desktop bundle. The full suite (npm test) still runs locally before a release.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Test tools
        run: pip install playwright
      - name: Essentials
        env: { TRIBE_NO_DOWNLOAD: '1', TRIBE_TEST: '1' }
        run: |
          git config --global user.name "TribeCode CI"; git config --global user.email "ci@tribecode.org"
          node app/test/bundle_test.js
          node app/test/ot_test.js
          python3 app/test/security_test.py
          python3 app/test/security2_test.py
          python3 app/test/security3_test.py
          python3 app/test/ui_smoke.py
          python3 app/test/e2e_friend.py
          python3 app/test/e2e_session.py
          python3 app/test/e2e_outbox.py
          python3 app/test/e2e_journeys.py
          python3 app/test/e2e_fresh.py

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            triple: aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Build the tribe server sidecar (standalone, no Node needed by users)
        shell: bash
        run: node scripts/build-sidecar.js ${{ matrix.triple || '' }}

      - name: Install Tauri CLI
        working-directory: app
        run: npm install

      - name: Sync app version with the tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            node -e "const f='app/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$V';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          fi

      - name: Updater signing (skipped until the key is set up)
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "
            const f='app/src-tauri/tauri.conf.json', c=require('./'+f);
            if (process.env.PUBKEY && process.env.HAS_KEY === 'true') { c.plugins.updater.pubkey = process.env.PUBKEY; console.log('updater signing on'); }
            else { c.bundle.createUpdaterArtifacts = false; console.log('No signing key yet: building installers without auto-update files. Run node scripts/setup-release.js'); }
            require('fs').writeFileSync(f, JSON.stringify(c, null, 2));"

      # Tauri downloads its bundling tools from GitHub release links, which sometimes answer 504 for a while.
      # Keep them between runs, and fetch the Windows ones through the API (a different path) before building.
      - name: Cache Tauri's bundling tools (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ matrix.platform }}-v2

      - name: Pre-fetch the Windows installer tools
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Fetch($tag, $repo, $pattern, $dir) {
            for ($i = 0; $i -lt 5; $i++) { gh release download $tag --repo $repo --pattern $pattern --dir $dir --clobber; if ($LASTEXITCODE -eq 0) { return $true }; Start-Sleep -Seconds 20 }
            return $false
          }
          $t = Join-Path $env:LOCALAPPDATA 'tauri'; $n = Join-Path $t 'NSIS'
          New-Item -ItemType Directory -Force $t | Out-Null
          if (-not (Test-Path (Join-Path $n 'makensis.exe'))) {
            if (Fetch 'nsis-3.13' 'tauri-apps/binary-releases' 'nsis-3.13.zip' $env:RUNNER_TEMP) {
              Expand-Archive (Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip') -DestinationPath $t -Force
              if (Test-Path (Join-Path $t 'nsis-3.13')) { if (Test-Path $n) { Remove-Item $n -Recurse -Force }; Rename-Item (Join-Path $t 'nsis-3.13') 'NSIS' }
            }
          }
          $d = Join-Path $n 'Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force $d | Out-Null
          if (-not (Test-Path (Join-Path $d 'nsis_tauri_utils.dll'))) { Fetch 'nsis_tauri_utils-v0.5.3' 'tauri-apps/nsis-tauri-utils' 'nsis_tauri_utils.dll' $d | Out-Null }
          Get-ChildItem $n -Recurse -Filter 'nsis_tauri_utils.dll' | ForEach-Object { $_.FullName }

      - name: Pre-fetch the AppImage tools
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          t=~/.cache/tauri; mkdir -p "$t"
          if [ ! -s "$t/AppRun-x86_64" ]; then
            for i in 1 2 3 4 5; do gh release download apprun-old --repo tauri-apps/binary-releases --pattern AppRun-x86_64 --dir "$t" --clobber && break; sleep 20; done
          fi
          if [ ! -s "$t/linuxdeploy-x86_64.AppImage" ]; then
            for i in 1 2 3 4 5; do gh release download linuxdeploy-07333c6 --repo tauri-apps/binary-releases --pattern linuxdeploy-x86_64.AppImage --dir "$t" --clobber && break; sleep 20; done
          fi
          chmod +x "$t"/AppRun-x86_64 "$t"/linuxdeploy-x86_64.AppImage 2>/dev/null || true; ls -la "$t"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'TribeCode v__VERSION__'
          releaseBody: 'See CHANGELOG.md for what changed. Already installed? TribeCode will show a "Restart to update" pill.'
          # a draft until every platform built (the publish job below): a half-built release never reaches the updater
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
          args: ${{ matrix.args }}
          # GitHub's release downloads (WiX, AppRun) sometimes answer 504: try the build again before giving up
          retryAttempts: 3

  # Publish only when Windows, macOS and Linux all built, so latest.json always lists every platform.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; fi
          gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --draft=false --latest
