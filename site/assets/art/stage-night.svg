<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t"><title id="t">A flat night scene: friends and a small robot around a campfire, a tent, hills, pines and stars</title>
