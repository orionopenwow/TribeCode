<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn · TribeCode</title>
<meta name="description" content="Learn to make apps, games and websites with friends, one short lesson at a time: what code is, your first app, building together, and coding languages explained simply. Free, with quick checks and badges.">
<meta name="theme-color" content="#1D2021">
<link rel="icon" type="image/svg+xml" href="assets/brand/icon.svg">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<meta property="og:title" content="Learn · TribeCode">
<meta property="og:description" content="Four short modules: what code is, your first app, building together, and languages explained simply. Free, with badges.">
<meta property="og:image" content="https://tribecode.org/assets/og-image.png">
<link rel="stylesheet" href="styles.css?v=0.20.0">
<style>
  .lx { max-width: 1120px; margin: 0 auto; padding: 32px 24px 48px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
  .lx-side { position: sticky; top: 84px; display: grid; gap: 10px; }
  .lx-me { padding: 16px; border: 1px solid var(--edge); border-radius: 14px; background: var(--surface); display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
  .lx-ring { --p: 0; width: 56px; height: 56px; border-radius: 50%; background: conic-gradient(var(--ember) calc(var(--p) * 1%), var(--main, #1D2021) 0); display: grid; place-items: center; }
  .lx-ring b { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--text); font: 700 13px/1 var(--mono, ui-monospace, monospace); }
  .lx-me strong { display: block; color: var(--text); font-size: 15px; } .lx-me span { color: var(--muted); font-size: 13px; }
  .lx-badges { display: flex; gap: 4px; margin-top: 6px; } .lx-badges i { font-style: normal; font-size: 16px; filter: grayscale(1); opacity: .35; } .lx-badges i.on { filter: none; opacity: 1; }
  .lx-mods { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .lx-mod { border: 1px solid var(--edge); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .lx-mod > button { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .lx-mod > button .e { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--main, #1D2021); font-size: 17px; }
  .lx-mod > button b { display: block; font-size: 14.5px; } .lx-mod > button small { color: var(--muted); font-size: 12.5px; }
  .lx-mod .st { font: 600 12px/1 var(--mono, ui-monospace, monospace); color: var(--muted); } .lx-mod.done .st { color: #3BD16F; }
  .lx-mod.open { border-color: color-mix(in srgb, var(--ember) 55%, var(--edge)); }
  .lx-less { list-style: none; margin: 0; padding: 0 8px 8px; display: none; } .lx-mod.open .lx-less { display: grid; gap: 2px; }
  .lx-less a { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 14px; }
  .lx-less a:hover { background: var(--main, #1D2021); color: var(--text); }
  .lx-less a.cur { background: var(--main, #1D2021); color: var(--text); font-weight: 600; }
  .lx-less a i { font-style: normal; font-size: 12px; color: var(--edge); } .lx-less a.done i { color: #3BD16F; }
  .lx-main { min-width: 0; }
  .lx-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .lx-top .crumb { color: var(--muted); font: 500 12.5px/1.2 var(--mono, ui-monospace, monospace); letter-spacing: .04em; text-transform: uppercase; }
  .lx-bar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface); overflow: hidden; } .lx-bar span { display: block; height: 100%; background: var(--ember); transition: width .3s ease; }
  .lx-card { padding: 28px 30px; border: 1px solid var(--edge); border-radius: 18px; background: var(--surface); min-height: 340px; animation: lx-in .25s ease both; }
  @keyframes lx-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .lx-card h1 { margin: 6px 0 12px; color: var(--text); font-size: clamp(26px, 3vw, 34px); line-height: 1.15; letter-spacing: -.02em; }
  .lx-card .k { color: var(--ember); font: 600 12px/1 var(--mono, ui-monospace, monospace); letter-spacing: .06em; text-transform: uppercase; }
  .lx-card p, .lx-card li { color: var(--muted); font-size: 16.5px; line-height: 1.65; max-width: 66ch; }
  .lx-card pre { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--main, #1D2021); border: 1px solid var(--edge); overflow-x: auto; font: 13.5px/1.6 var(--mono, ui-monospace, monospace); color: var(--text); }
  .lx-card details { margin-top: 14px; border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px; background: var(--main, #1D2021); }
  .lx-card summary { cursor: pointer; color: var(--text); font-weight: 600; font-size: 14.5px; }
  .lx-tip { margin-top: 16px; padding: 12px 14px; border-left: 3px solid var(--ember); background: var(--main, #1D2021); border-radius: 0 10px 10px 0; color: var(--muted); font-size: 15px; }
  .lx-nav { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .lx-nav .sp { flex: 1; }
  .lx-q { margin: 0 0 18px; } .lx-q > b { display: block; margin-bottom: 8px; color: var(--text); font-size: 16px; }
  .lx-opts { display: grid; gap: 8px; }
  .lx-opts button { text-align: left; padding: 11px 14px; border: 1px solid var(--edge); border-radius: 10px; background: var(--main, #1D2021); color: var(--text); font: inherit; font-size: 15px; cursor: pointer; }
  .lx-opts button:hover:not(:disabled) { border-color: var(--ember); }
  .lx-opts button.right { border-color: #3BD16F; background: color-mix(in srgb, #3BD16F 16%, var(--main, #1D2021)); }
  .lx-opts button.wrong { border-color: #FF6F8E; background: color-mix(in srgb, #FF6F8E 14%, var(--main, #1D2021)); }
  .lx-why { margin: 8px 0 0; font-size: 14.5px; color: var(--muted); }
  .lx-badge { display: inline-flex; align-items: center; gap: 10px; margin-top: 8px; padding: 10px 16px; border-radius: 999px; border: 2px solid #FABD2F; color: var(--text); font-weight: 700; background: color-mix(in srgb, #FABD2F 12%, var(--main, #1D2021)); }
  .lx-words { margin-top: 18px; } .lx-words summary { color: var(--muted); cursor: pointer; }
  .lx-words dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; margin: 10px 0 0; }
  .lx-words dt { color: var(--text); font-weight: 600; font-size: 14.5px; } .lx-words dd { margin: 2px 0 8px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  @media (max-width: 860px) {
    .lx { grid-template-columns: 1fr; padding: 16px 16px 40px; gap: 14px; }
    .lx-side { position: static; }
    .lx-card { padding: 20px 18px; min-height: 0; }
    .lx-words dl { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .lx-card { animation: none; } }
</style>
</head>
<body>
<header class="nav">
  <div class="nav__in wrap" style="justify-content:space-between">
    <a class="nav__logo" href="index.html" aria-label="TribeCode home"><img src="assets/brand/wordmark.svg" alt="TribeCode" width="150" height="26"></a>
    <div class="nav__end">
      <a class="nav__text" href="index.html">Home</a>
      <a class="nav__text" href="app/?welcome=1">Open the app</a>
      <a class="btn btn--light btn--sm" href="https://github.com/orionopenwow/TribeCode/releases/latest">Download</a>
    </div>
  </div>
</header>
<main class="lx" id="lx">
  <aside class="lx-side" aria-label="Modules">
    <div class="lx-me"><div class="lx-ring" id="lx-ring"><b id="lx-pct">0%</b></div><div><strong>Learn TribeCode</strong><span id="lx-sum">4 modules · about 45 min</span><div class="lx-badges" id="lx-badges"></div></div></div>
    <ol class="lx-mods" id="lx-mods"></ol>
  </aside>
  <section class="lx-main" aria-live="polite">
    <div class="lx-top"><span class="crumb" id="lx-crumb"></span><div class="lx-bar" aria-hidden="true"><span id="lx-bar"></span></div></div>
    <article class="lx-card" id="lx-card"></article>
    <div class="lx-nav"><button class="btn btn--dark" id="lx-back" type="button">← Back</button><span class="sp"></span><button class="btn btn--light" id="lx-next" type="button">Next →</button></div>
    <details class="lx-words"><summary>📖 Words to know</summary><dl id="lx-words"></dl></details>
  </section>
</main>
<footer class="footer"><div class="wrap footer__legal mono"><p>© 2026 TribeCode contributors · MIT</p><p>Claude and Claude Code are products of Anthropic. TribeCode is an independent project that works with them.</p></div></footer>
<script>
(function () {
  'use strict';
  // the course: four modules of short lessons, each ending with a 3-question check that earns a badge
  const M = [
    { id: 'm1', e: '💡', t: 'What code is', min: 8, badge: '🔥', bname: 'First Spark', lessons: [
      ['Computers follow instructions exactly', '<p>Computers don’t guess what you meant. “When someone taps Start, show level 1” has to be spelled out, step by step. That spelled-out version is <b>code</b>.</p><div class="lx-tip">Every app, game and website you use is made of these steps.</div>'],
      ['Languages are ways to write the steps', '<p>Like spoken languages, each coding language has its own words and grammar. Some are best for web pages, some for phones, some for data. You can start with any of them.</p>'],
      ['Code lives in files and folders', '<p>A small website might be three files. A big game might be thousands. A project’s folder of code, with every saved change, is its <b>code repository</b>.</p>'],
      ['AI helpers can do the typing', '<p>Tools like Claude Code, Codex and Gemini CLI read your project and write code when you describe what you want in plain words.</p><div class="lx-tip">You still decide what to build and check that it works. That part is the craft.</div>'],
    ], quiz: [
      ['What is code?', ['A list of instructions a computer follows', 'A secret password', 'A kind of picture'], 0, 'Code spells out, step by step, what the computer should do.'],
      ['What is a code repository?', ['A coding contest', 'The shared folder with a project’s code and its saved changes', 'A type of computer'], 1, 'It keeps every version, so everyone works from one place.'],
      ['What does an AI helper do?', ['Writes code from what you describe', 'Decides what your app is for', 'Replaces your friends'], 0, 'It types; you and your tribe decide and check.'],
    ] },
    { id: 'm2', e: '🧱', t: 'Your first app', min: 12, badge: '🧱', bname: 'Builder', lessons: [
      ['Write the idea down', '<p>One or two sentences: what it is and who it’s for. “A recipe app for our family, so everyone can add their favorites.” That’s your <b>vision</b>.</p>'],
      ['Break it into small tasks', '<p>“Show a list of recipes.” “Add a recipe.” “Search by name.” Small tasks are easier to finish and easier to share out.</p>'],
      ['Connect an AI helper', '<p>Give it one task at a time. It writes the code, runs it, and tells you what it changed.</p>'],
      ['Try it in the preview', '<p>Click around like a user would. If something looks wrong, say what you saw. Fixing is part of making.</p>'],
      ['Save the change', '<p>Each working step is saved in the code repository with a short note, so you can always go back.</p>'],
      ['Share it', '<p>Send friends a link, put the website online, or publish the app. Then start the next small task.</p><div class="lx-tip">In TribeCode, the Getting started checklist walks you through the first four steps.</div>'],
    ], quiz: [
      ['What is a vision?', ['A sentence or two: what it is and who it’s for', 'The app’s logo', 'A long technical spec'], 0, 'Short and clear beats long.'],
      ['Why split work into small tasks?', ['They’re easier to finish and share out', 'Computers need it', 'It looks busier'], 0, 'Small tasks keep everyone moving.'],
      ['What should you do after a small change works?', ['Save it with a short note', 'Delete the old files', 'Wait until the whole app is done'], 0, 'Small saved changes are easy to review and undo.'],
    ] },
    { id: 'm3', e: '🤝', t: 'Building together', min: 10, badge: '🤝', bname: 'Teammate', lessons: [
      ['One shared folder', '<p>Everyone works from the same <b>code repository</b> on GitHub, so nobody emails files around.</p>'],
      ['Save small and often', '<p>Save a change each time something works, with a note saying what changed. The history shows who did what.</p>'],
      ['Branches: your own copy', '<p>A <b>branch</b> is a side copy where you try things. When it works, it’s <b>merged</b> back into the main version.</p>'],
      ['Claim your part', '<p>Say which files or features you’re working on. Your AI helper stays in that part, so changes don’t collide.</p>'],
      ['A second pair of eyes', '<p>Before a change joins the main version, someone looks and approves. In TribeCode that’s one tap, or a vote.</p>'],
      ['Ask, don’t assume', '<p>Post what you’re doing, ask before changing someone else’s part, and thank people for reviews.</p>'],
    ], quiz: [
      ['What is a branch?', ['A side copy where you try things', 'A backup drive', 'A chat channel'], 0, 'It’s merged back when it works.'],
      ['Why claim your part before your AI starts?', ['So changes don’t collide', 'It makes code faster', 'It’s required by law'], 0, 'Staying in lanes keeps merges smooth.'],
      ['What happens before a change joins the main version?', ['Someone reviews and approves it', 'Nothing', 'It’s deleted'], 0, 'A quick look catches mistakes early.'],
    ] },
    { id: 'm4', e: '🗣️', t: 'Languages, simply', min: 15, badge: '🗣️', bname: 'Polyglot', lessons: [
      ['HTML and CSS · websites', '<p>HTML says what’s on a page (a heading, a button). CSS says how it looks (colors, sizes, layout).</p><pre>&lt;button class="go"&gt;Start&lt;/button&gt;\n.go { background: orange; }</pre><details><summary>Deeper</summary><p>Every web page is built on these two. They describe structure and style; JavaScript makes decisions.</p></details>'],
      ['JavaScript · websites and apps', '<p>Makes web pages do things: react to clicks, load data, run games in the browser.</p><pre>button.onclick = () =&gt; { score = score + 1; };</pre><details><summary>Deeper</summary><p>It runs in every browser, and with Node.js on servers too. TypeScript adds labels for kinds of data, which catches mistakes early.</p></details>'],
      ['Python · data, AI, tools', '<p>Reads almost like English. Popular for data, AI, automation and first programs.</p><pre>for name in friends:\n    print("Hi", name)</pre><details><summary>Deeper</summary><p>Great for scripts that tidy files, analyze spreadsheets or talk to AI models.</p></details>'],
      ['Swift and Kotlin · phone apps', '<p>Swift makes iPhone apps; Kotlin makes Android apps.</p><pre>Text("Hello, tribe!")</pre><details><summary>Deeper</summary><p>React Native or Flutter build for both from one codebase. Publishing to the App Store needs a Mac.</p></details>'],
      ['C#, GDScript, Phaser · games', '<p>C# powers Unity games. GDScript is the simple language of the free Godot engine. Phaser makes browser games in JavaScript.</p><pre>func _on_jump():\n    velocity.y = -400</pre>'],
      ['SQL · saving data', '<p>Asks questions of a database: “show every recipe with chocolate in it.”</p><pre>SELECT name FROM recipes WHERE name LIKE \'%chocolate%\';</pre>'],
      ['The terminal · glue', '<p>A text window where you type commands. AI helpers like Claude Code run there.</p><pre>cd my-game\ngit status</pre>'],
    ], quiz: [
      ['Which language describes what is on a web page?', ['HTML', 'SQL', 'Swift'], 0, 'HTML lists it; CSS styles it; JavaScript makes it act.'],
      ['Which is popular for data and AI scripts?', ['Python', 'CSS', 'GDScript'], 0, 'Python reads almost like English.'],
      ['What does SQL do?', ['Asks questions of a database', 'Draws buttons', 'Makes sounds'], 0, 'It finds and saves data.'],
    ] },
  ];
  const WORDS = [['Code repository', 'The shared online folder with a project’s code and every saved change. Often on GitHub.'], ['Saved change (commit)', 'A snapshot of the code with a short note about what changed.'], ['Branch', 'A side copy for trying things without touching the main version.'], ['Merge', 'Bringing a branch’s changes back into the main version.'], ['AI helper (agent)', 'An AI tool that reads your project and writes code from plain words.'], ['Preview', 'A live view of your app that updates as the code changes.'], ['Bug', 'Something that doesn’t work as it should. Fixing bugs is normal.'], ['Open source', 'Code anyone can read, use and improve. TribeCode is open source (MIT).']];

  // progress on this device: lessons done, checks passed, where you were
  const KEY = 'tribecode.learn.v2';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
  const P = Object.assign({ done: {}, passed: {}, at: 'm1-0' }, load());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch {} };
  const steps = M.flatMap(m => [...m.lessons.map((_, i) => `${m.id}-${i}`), `${m.id}-q`]);
  const $ = s => document.querySelector(s);
  const modOf = k => M.find(m => k.startsWith(m.id + '-'));
  const total = steps.length, doneCount = () => steps.filter(k => (k.endsWith('-q') ? P.passed[k.slice(0, 2)] : P.done[k])).length;

  function side(cur) {
    const pct = Math.round(doneCount() / total * 100);
    $('#lx-ring').style.setProperty('--p', pct); $('#lx-pct').textContent = pct + '%';
    const nPass = M.filter(m => P.passed[m.id]).length;
    $('#lx-sum').textContent = `${nPass} of ${M.length} modules · about 45 min`;
    $('#lx-badges').innerHTML = M.map(m => `<i class="${P.passed[m.id] ? 'on' : ''}" title="${m.bname}${P.passed[m.id] ? ' · earned' : ''}">${m.badge}</i>`).join('');
    const cm = modOf(cur);
    $('#lx-mods').innerHTML = M.map(m => {
      const n = m.lessons.filter((_, i) => P.done[`${m.id}-${i}`]).length, all = P.passed[m.id];
      return `<li class="lx-mod ${m === cm ? 'open' : ''} ${all ? 'done' : ''}"><button type="button" data-mod="${m.id}"><span class="e">${m.e}</span><span><b>${m.t}</b><small>${m.lessons.length} lessons · ${m.min} min</small></span><span class="st">${all ? '✓ ' + m.badge : n ? `${n}/${m.lessons.length}` : 'Start'}</span></button>
        <ol class="lx-less">${m.lessons.map((l, i) => `<li><a href="#${m.id}-${i}" class="${cur === `${m.id}-${i}` ? 'cur' : ''} ${P.done[`${m.id}-${i}`] ? 'done' : ''}"><i>●</i>${l[0]}</a></li>`).join('')}<li><a href="#${m.id}-q" class="${cur === `${m.id}-q` ? 'cur' : ''} ${all ? 'done' : ''}"><i>●</i>✅ Quick check</a></li></ol></li>`;
    }).join('');
    $('#lx-mods').querySelectorAll('[data-mod]').forEach(b => b.onclick = () => { const m = M.find(x => x.id === b.dataset.mod); const first = m.lessons.findIndex((_, i) => !P.done[`${m.id}-${i}`]); go(first < 0 ? `${m.id}-q` : `${m.id}-${first}`); });
  }

  function go(k, push = true) {
    if (!steps.includes(k)) k = steps[0];
    P.at = k; save(); if (push) history.replaceState(null, '', '#' + k);
    const m = modOf(k), i = steps.indexOf(k), card = $('#lx-card');
    $('#lx-crumb').textContent = `Module ${M.indexOf(m) + 1} · ${m.t}`;
    $('#lx-bar').style.width = Math.round(doneCount() / total * 100) + '%';
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    if (k.endsWith('-q')) {
      const got = {};
      card.innerHTML = `<span class="k">Quick check · ${m.t}</span><h1>Three questions</h1><p>No timer and no penalty. Get two right to earn the <b>${m.bname}</b> badge ${m.badge}.</p>` +
        m.quiz.map((q, qi) => `<div class="lx-q" data-q="${qi}"><b>${qi + 1}. ${q[0]}</b><div class="lx-opts">${q[1].map((o, oi) => `<button type="button" data-a="${oi}">${o}</button>`).join('')}</div><p class="lx-why" hidden></p></div>`).join('') +
        `<div id="lx-earn">${P.passed[m.id] ? `<span class="lx-badge">${m.badge} ${m.bname} badge earned</span>` : ''}</div>`;
      card.querySelectorAll('.lx-q').forEach(el => el.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b || b.disabled) return;
        const qi = +el.dataset.q, ok = +b.dataset.a === m.quiz[qi][2];
        el.querySelectorAll('button').forEach(x => { x.disabled = true; if (+x.dataset.a === m.quiz[qi][2]) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        const w = el.querySelector('.lx-why'); w.hidden = false; w.textContent = (ok ? '✓ Right. ' : 'Not quite. ') + m.quiz[qi][3];
        got[qi] = ok;
        if (Object.keys(got).length === m.quiz.length && Object.values(got).filter(Boolean).length >= 2 && !P.passed[m.id]) {
          P.passed[m.id] = true; save(); $('#lx-earn').innerHTML = `<span class="lx-badge">${m.badge} ${m.bname} badge earned</span>`; side(k);
        }
      }));
    } else {
      const li = +k.split('-')[1], l = m.lessons[li];
      card.innerHTML = `<span class="k">Lesson ${li + 1} of ${m.lessons.length} · ${m.min} min module</span><h1>${l[0]}</h1>${l[1]}`;
    }
    $('#lx-back').disabled = i === 0;
    $('#lx-next').textContent = k.endsWith('-q') ? (i === total - 1 ? 'Finish 🎉' : 'Next module →') : 'Got it, next →';
    side(k);
    if (matchMedia('(max-width: 860px)').matches && push) $('#lx-crumb').scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  $('#lx-next').onclick = () => {
    const k = P.at, i = steps.indexOf(k);
    if (!k.endsWith('-q')) P.done[k] = true;
    save();
    if (i < total - 1) go(steps[i + 1]); else location.href = 'app/?welcome=1';
  };
  $('#lx-back').onclick = () => { const i = steps.indexOf(P.at); if (i > 0) go(steps[i - 1]); };
  addEventListener('hashchange', () => { const h = location.hash.slice(1); if (steps.includes(h) && h !== P.at) go(h, false); });
  addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input, textarea')) return; if (e.key === 'ArrowRight') $('#lx-next').click(); if (e.key === 'ArrowLeft') $('#lx-back').click(); });
  $('#lx-words').innerHTML = WORDS.map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join('');
  const h = location.hash.slice(1);
  go(steps.includes(h) ? h : h === 'quiz' ? 'm1-q' : (P.at || 'm1-0'), false);
  window.TribeLearn = { M, steps, progress: () => P };
})();
</script>
<script src="main.js?v=0.20.0" defer></script>
</body>
</html>
