<!doctype html><meta charset=utf-8><link rel=stylesheet href=base.css><div class=app>
<div class=row style="justify-content:space-between"><div><h1>Habits</h1><div class=muted>Week of Nov 9 · you and 3 friends</div></div><span class="btn p">+ New habit</span></div>
<div id=list style="display:grid;gap:10px;margin-top:18px"></div></div>
<script>
const H=[['💧','Drink water',[1,1,1,1,0,1,1],12,'Maya, Jay'],['📖','Read 20 min',[1,1,0,1,1,1,0],5,'Camp'],['🏃','Morning run',[1,0,1,1,0,0,1],3,'Jay'],['🎸','Practice guitar',[0,1,1,1,1,1,1],9,'Ana']];
const D='MTWTFSS';function draw(){document.getElementById('list').innerHTML=H.map(([e,n,w,s,f])=>`<div class="card row" style="justify-content:space-between"><div class=row><span style="font-size:22px">${e}</span><div><b>${n}</b><div class=muted style="font-size:13px">🔥 ${s}-day streak · cheered by ${f}</div></div></div><div class=row style="gap:6px">${w.map((d,i)=>`<div data-h="${H.findIndex(x=>x[1]===n)},${i}" style="cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;background:${d?'#3BD16F':'#262D37'};color:${d?'#0D1014':'#6B7480'}">${D[i]}</div>`).join('')}</div></div>`).join('');document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.h.split(',');H[i][2][j]^=1;H[i][3]+=H[i][2][j]?1:-1;draw();});}draw();
</script>
<script src="../i18n.js" defer></script>
