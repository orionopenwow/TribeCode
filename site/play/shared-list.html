<!doctype html><meta charset=utf-8><link rel=stylesheet href=base.css><div class=app>
<h1>Weekend trip 🏕️</h1><div class=muted>Everyone edits live · 3 here now</div>
<div class=card style="margin-top:16px"><form id=add class=row style="margin-bottom:10px"><input id=in placeholder="Add an item…" style="flex:1;padding:10px 12px;border:1px solid #2A313C;border-radius:10px;background:none;color:#F1F3F6;font:inherit"><button class="btn p">Add</button></form>
<div id=l></div></div></div><script>
const I=[[1,'Tent and stakes','Jay'],[1,'Marshmallows','Maya'],[0,'Headlamps (4)','Camp'],[0,'Card games','Ana'],[0,'Bug spray',''],[1,'Water filter','Jay']];
function draw(){document.getElementById('l').innerHTML=I.map(([d,t,w],k)=>`<div data-i="${k}" class=row style="cursor:pointer;padding:10px 4px;border-top:1px solid #2A313C;justify-content:space-between"><div class=row><span style="width:20px;height:20px;border-radius:6px;border:2px solid ${d?'#3BD16F':'#3A4250'};background:${d?'#3BD16F':'none'};display:grid;place-items:center;color:#0D1014;font-size:13px;font-weight:900">${d?'✓':''}</span><span style="${d?'text-decoration:line-through;color:#6B7480':''}">${t}</span></div>${w?`<span class=chip>${w}</span>`:''}</div>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{I[b.dataset.i][0]^=1;draw();});}draw();document.getElementById('add').onsubmit=e=>{e.preventDefault();const v=document.getElementById('in').value.trim();if(v){I.push([0,v,'You']);document.getElementById('in').value='';draw();}};
</script>
<script src="../i18n.js" defer></script>
