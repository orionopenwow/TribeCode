<!doctype html>
<html lang="en" data-preset="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-s="name">Mara Okafor</title>
  <meta name="description" data-s-attr="content:bio" content="">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <style id="s-theme"></style>
</head>
<body>
  <div class="page">
    <header class="who">
      <img class="avatar" data-s-attr="src:avatar;alt:name" src="img/avatar.svg" alt="" width="96" height="96">
      <h1 data-s="name">Mara Okafor</h1>
      <p class="handle" data-s="handle">@maramakespots</p>
      <p class="bio" data-s="bio">Ceramics from a garage studio.</p>
    </header>

    <main data-s-sections>
      <section data-section="links" aria-label="Links">
        <ul class="links">
          <template data-s-for="links"><li><a href="{{url}}"><span class="l-t">{{label}}</span>{{#note}}<span class="l-n">{{note}}</span>{{/note}}<span class="l-a" aria-hidden="true">→</span></a></li></template>
          <!--/s-for-->
        </ul>
      </section>

      <section data-section="socials" aria-label="Social profiles">
        <ul class="socials">
          <template data-s-for="socials"><li><a href="{{url}}">{{label}}</a></li></template>
          <!--/s-for-->
        </ul>
      </section>
    </main>

    <footer class="foot"><span data-s="footer">Made in Tucson</span></footer>
  </div>
  <script type="application/json" id="site-data"></script>
  <script src="site.js"></script>
</body>
</html>
