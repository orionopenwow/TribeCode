<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <form id="form" class="search"><input class="input" id="city" placeholder="Search a city" autocomplete="off" aria-label="City"><button class="btn primary">Show</button></form>
    <section class="card now" id="now"></section>
    <section class="days" id="days"></section>
    <p class="muted small" id="note"></p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
