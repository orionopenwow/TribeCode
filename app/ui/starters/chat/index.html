<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header class="bar"><span class="dot"></span><div><b id="title">#general</b><small class="muted" id="who">3 online</small></div></header>
    <div id="log" class="log" aria-live="polite"></div>
    <form id="form" class="composer"><input class="input" id="msg" placeholder="Message" autocomplete="off" aria-label="Message"><button class="btn primary" type="submit">Send</button></form>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
