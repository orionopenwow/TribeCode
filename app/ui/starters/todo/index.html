<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="title">To-do</h1>
    <p class="muted" id="left"></p>
    <form id="form"><input type="text" class="input" id="input" placeholder="Add a to-do and press Enter" autocomplete="off" aria-label="New to-do"></form>
    <ul class="todos" id="todos"></ul>
    <p class="muted small">Click to mark done. Right-click or ✕ to delete.</p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
